<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html {
            /* TODO: high contrast mode */
            --hover: rgba(0, 0, 0, .03);
            --active: rgba(0, 0, 0, .05);
            --border: rgba(0, 0, 0, .15);
            --bg: var(--light-bg);
            --fg: var(--light-fg);
            --arianna-reader-background-image: none;
            --arianna-reader-background-position: center center;
            --arianna-reader-background-repeat: no-repeat;
            --arianna-reader-background-size: cover;
            --arianna-reader-background-filter: none;
            height: 100%;
        }

        body {
            margin: 0 auto;
            height: 100%;
            background-image: var(--arianna-reader-background-image);
            background-color: var(--bg);
            background-position: var(--arianna-reader-background-position);
            background-repeat: var(--arianna-reader-background-repeat);
            background-size: var(--arianna-reader-background-size);
            background-attachment: fixed;
            color: var(--fg);
        }

        body.invert {
            background: #000;
            color: #fff;
        }

        @media (prefers-color-scheme: dark) {
            html {
                --hover: rgba(255, 255, 255, .03);
                --active: rgba(255, 255, 255, .05);
                --border: rgba(255, 255, 255, .15);
                --bg: var(--dark-bg);
                --fg: var(--dark-fg);
            }
        }

        foliate-view::part(head),
        foliate-view::part(foot) {
            font-family: system-ui;
            font-size: 9pt;
        }

        foliate-view {
            --overlayer-highlight-blend-mode: multiply;
        }

        foliate-view::part(filter) {
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            foliate-view {
                --overlayer-highlight-blend-mode: screen;
            }
        }

        #ribbon {
            visibility: hidden;
            display: inline-block;
            position: absolute;
            left: 48px;
            z-index: 1;
        }

        #ribbon:before,
        #ribbon:after {
            content: "";
            display: block;
            position: absolute;
            height: 10px;
            border: 9px solid red;
        }

        #ribbon:before {
            border-bottom-color: transparent;
            bottom: -40px;
        }

        .reader-dialog {
            font: menu;
            padding: 0;
            border-radius: 12px;
            border: 0;
            box-shadow: 0 0 0 1px var(--border), 0 0 12px rgba(0, 0, 0, .2);
            -webkit-user-select: none;
            background: var(--bg);
            color: var(--fg);
            box-sizing: border-box;
            overflow: hidden;
        }

        .reader-dialog:not([open]) {
            display: none;
        }

        .reader-dialog--stacked {
            display: flex;
            flex-direction: column;
        }

        /* Keep the resource owner alive for the native footnote window. */
        #footnote-source {
            position: fixed;
            left: -10000px;
            top: 0;
            width: 600px;
            height: 600px;
            pointer-events: none;
        }

        .reader-dialog header {
            text-align: center;
            font-weight: bold;
            padding: 9px;
            border-bottom: 1px solid var(--border);
            cursor: default;
            flex: none;
        }

        .reader-dialog main {
            flex: 1;
            min-height: 0;
        }

        .reader-dialog--stacked>div,
        .reader-dialog--stacked main {
            display: flex;
            flex-direction: column;
        }

        .reader-dialog--stacked>div {
            flex: none;
        }

        .reader-dialog footer {
            display: flex;
            border-top: 1px solid var(--border);
        }

        .reader-dialog footer {
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .reader-dialog footer button {
            flex: 1;
            border: 0;
            margin: 0;
            padding: 12px 16px;
            font-weight: bold;
            color: inherit;
            background: none;
            min-width: 0;
        }

        .reader-dialog footer button+button {
            border-inline-start: 1px solid var(--border);
        }

        .reader-dialog footer button:hover {
            background: var(--hover);
        }

        .reader-dialog footer button:active {
            background: var(--active);
        }

        #footnote-source foliate-view {
            display: block;
            width: 100%;
            height: 100%;
        }

        @media (max-width: 500px) {
            .reader-dialog {
                margin: 0;
                margin-top: auto;
                width: 100%;
                max-width: 100%;
                border-bottom-left-radius: 0;
                border-bottom-right-radius: 0;
            }
        }
    </style>
</head>

<body>
    <script src="qrc:/qtwebchannel/qwebchannel.js"></script>
    <script src="reader.js" type="module"></script>
    <div id="viewer"></div>
    <div id="footnote-source" aria-hidden="true" inert></div>

</body>

</html>
