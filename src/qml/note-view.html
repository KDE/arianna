<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src qrc:; style-src 'unsafe-inline'; font-src qrc: data:; connect-src qrc:; worker-src qrc: blob:; img-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<style>
:root { color-scheme:light dark; font:16px system-ui } body { margin:16px; overflow-wrap:anywhere }
p,li { line-height:1.55; white-space:pre-wrap } pre { overflow:auto; white-space:pre; padding:12px; border:1px solid #888 }
code { font-family:monospace } table { border-collapse:collapse } th,td { border:1px solid #888; padding:6px }
blockquote { border-left:3px solid #888; margin-left:0; padding-left:12px } a { color:#3689d8 }
.chat-conversation { display:flex; flex-direction:column; gap:16px }
.chat-message { border:1px solid color-mix(in srgb,currentColor 30%,transparent); border-radius:12px; padding:12px 16px; max-width:90% }
.chat-user { align-self:flex-end; background:color-mix(in srgb,#3689d8 12%,transparent) }
.chat-assistant { align-self:flex-start; background:color-mix(in srgb,currentColor 4%,transparent) }
.chat-role { font-weight:700; margin-bottom:8px }
.chat-status { font-style:italic }
.chat-message > :last-child { margin-bottom:0 }
mjx-container[display=true] { overflow:auto; padding:4px 0 }
</style><script defer src="note-view.js"></script></head><body><article id="note"></article></body></html>
